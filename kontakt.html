<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stephan Vibe - Kontakt</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ---------- Hintergrund mit Lichtflecken (damit das Glas etwas zum Verwischen hat) ---------- */
        body {
            background: #05060a !important;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 20%, rgba(80, 120, 255, 0.35), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(180, 80, 255, 0.28), transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(0, 200, 255, 0.22), transparent 45%);
        }

        /* ---------- Glas-Karte ---------- */
        .glass-card {
            --mx: 50%;
            --my: 50%;
            position: relative;
            overflow: hidden;
            padding: 2rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Lichtkegel, der der Maus folgt */
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(
                350px circle at var(--mx) var(--my),
                rgba(130, 170, 255, 0.22),
                transparent 60%
            );
        }

        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(140, 180, 255, 0.55);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 28px rgba(100, 150, 255, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .glass-card:hover::before {
            opacity: 1;
        }

        /* Inhalt über dem Lichtkegel halten */
        .glass-card > * {
            position: relative;
            z-index: 1;
        }

        /* Formular-Karte bleibt beim Tippen ruhig (kein Anheben) */
        .glass-card.form-card:hover {
            transform: none;
        }

        /* ---------- Schwebende Glas-Navigation ---------- */
        .glass-header {
            padding-top: 14px;
            pointer-events: none; /* nur die Pille selbst ist klickbar */
        }

        .glass-nav {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.5rem 0.6rem 0.5rem 1.4rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.07);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            backdrop-filter: blur(18px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* ---------- Schriftzug statt Logo ---------- */
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.02em;
            color: #fff;
            white-space: nowrap;
        }

        .nav-brand:hover {
            color: #fff;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #7fa8ff;
            box-shadow: 0 0 10px 2px rgba(110, 160, 255, 0.8);
            animation: brandPulse 2.4s ease-in-out infinite;
        }

        .brand-text span {
            background: linear-gradient(90deg, #8fb4ff, #c28bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @keyframes brandPulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(0.8); }
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ---------- Glas-Button ---------- */
        .glass-button {
            position: relative;
            overflow: hidden;
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            color: #fff;
            font-family: inherit;
            font-size: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: transform 0.25s ease, background 0.25s ease,
                        border-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* Lichtstreifen, der beim Hover über den Button läuft */
        .glass-button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                110deg,
                transparent,
                rgba(255, 255, 255, 0.35),
                transparent
            );
            transform: skewX(-20deg);
        }

        .glass-button:hover {
            color: #fff;
            transform: translateY(-2px);
            background: rgba(140, 180, 255, 0.18);
            border-color: rgba(140, 180, 255, 0.65);
            box-shadow:
                0 0 22px rgba(100, 150, 255, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .glass-button:hover::after {
            left: 130%;
            transition: left 0.7s ease;
        }

        .glass-button:active {
            transform: translateY(0);
        }

        .glass-button:focus-visible {
            outline: none;
            border-color: rgba(140, 180, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(110, 160, 255, 0.35);
        }

        /* Aktuelle Seite hervorheben */
        .glass-button.active {
            background: rgba(140, 180, 255, 0.22);
            border-color: rgba(140, 180, 255, 0.6);
            box-shadow:
                0 0 16px rgba(100, 150, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* Zurück-Button mit rotem Leuchten (wie vorher btn-hover-red) */
        .glass-button.back:hover {
            background: rgba(255, 90, 90, 0.18);
            border-color: rgba(255, 110, 110, 0.7);
            box-shadow:
                0 0 22px rgba(255, 80, 80, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* ---------- Seiteninhalt ---------- */
        .page-title {
            background: linear-gradient(90deg, #8fb4ff, #c28bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        /* ---------- Glas-Eingabefelder ---------- */
        .glass-input {
            color: #fff !important;
            color-scheme: dark;
            background: rgba(255, 255, 255, 0.07) !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 14px !important;
            padding: 0.8rem 1rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .glass-input:hover {
            border-color: rgba(140, 180, 255, 0.4) !important;
        }

        .glass-input:focus {
            background: rgba(140, 180, 255, 0.1) !important;
            border-color: rgba(140, 180, 255, 0.75) !important;
            box-shadow:
                0 0 22px rgba(100, 150, 255, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
        }

        textarea.glass-input {
            resize: vertical;
            min-height: 140px;
        }

        /* Browser-Autofill soll den Glas-Look nicht zerstören */
        .glass-input:-webkit-autofill {
            -webkit-text-fill-color: #fff;
            -webkit-box-shadow: 0 0 0 1000px rgba(40, 50, 80, 0.9) inset;
            caret-color: #fff;
        }

        .contact-wrap {
            max-width: 640px;
            margin-inline: auto;
        }

        .glass-input:invalid:not(:placeholder-shown) {
    border-color: rgba(255, 110, 110, 0.7) !important;
}

        @media (max-width: 575.98px) {
            .glass-nav { padding: 0.4rem 0.5rem 0.4rem 0.9rem; }
            .nav-brand { font-size: 1rem; gap: 0.45rem; }
            .glass-button { padding: 0.4rem 0.7rem; font-size: 0.85rem; }
            .nav-buttons { gap: 0.3rem; }
            .glass-card { padding: 1.5rem; }
            .glass-button.submit { width: 100%; padding: 0.7rem 1rem; font-size: 1rem; }
        }
    </style>
</head>

<body class="text-light">

    <header class="fixed-top glass-header">
        <div class="container">
            <nav class="glass-nav">
                <a class="nav-brand" href="index.html">
                    <span class="brand-dot"></span>
                    <span class="brand-text">Stephan <span>Vibe</span></span>
                </a>

                <div class="nav-buttons">
                    <a class="glass-button" href="index.html">Start</a>
                    <a class="glass-button" href="ueberMich.html">Über mich</a>
                    <a class="glass-button active" href="kontakt.html">Kontakt</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 110px;">

        <div class="contact-wrap">

            <h1 class="page-title mb-4 text-center">Kontakt</h1>

            <section class="glass-card form-card mb-5">

                <p class="text-white-50 mb-4">
                    Du hast Fragen oder möchtest einfach Hallo sagen? Schreib mir eine Nachricht!
                </p>

                <form action="https://formsubmit.co/stephanvibe@gmail.com" method="POST">

                    <input type="email" name="email" class="form-control glass-input mb-3"
    placeholder="E-Mail-Adresse" id="email" required
    pattern="[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}"
    title="Bitte eine gültige E-Mail-Adresse eingeben, z. B. name@beispiel.de">

                    <textarea name="message" class="form-control glass-input mb-4" id="message" rows="5"
                        placeholder="Nachricht" required></textarea>

                    <button type="submit" class="glass-button submit">Absenden</button>

                </form>

            </section>

        </div>

    </main>

    <script src="js/bootstrap.bundle.min.js"></script>

    <script>
        // Lichtkegel folgt der Maus auf den Glas-Karten
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
                card.style.setProperty('--my', `${e.clientY - rect.top}px`);
            });
        });

        const email = document.getElementById('email');
email.addEventListener('input', () => {
    email.setCustomValidity('');   // zuerst zurücksetzen
    if (!email.validity.valid) {
        email.setCustomValidity('Bitte eine gültige E-Mail-Adresse eingeben.');
    }
});
    </script>

</body>

</html>
