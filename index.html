<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stephan Vibe</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/index.css">

</head>

<body class="text-light">

    <header class="fixed-top glass-header">
        <div class="container">
            <nav class="glass-nav">
                <a class="nav-brand" href="index.html">
                    <span class="brand-dot"></span>
                    <span class="brand-text">Stephan <span>Vibe</span></span>
                </a>

                <div class="nav-buttons">
                    <a class="glass-button active" href="index.html">Start</a>
                    <a class="glass-button" href="ueberMich.html">Über mich</a>
                    <a class="glass-button" href="kontakt.html">Kontakt</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container pt-5 page-main">

        <!-- Karte 1: Titel -->
        <section class="glass-card card-hero mb-4">
            <h1 class="mb-0">
                <span id="tw-title" class="text-light fw-bold d-block"></span>
                <span id="tw-subtitle" class="text-white-50 fw-normal fs-4"></span>
            </h1>
        </section>

        <!-- Karte 2: Willkommen -->
        <section class="glass-card card-welcome">
            <h2 id="tw-welcome" class="fs-3 fw-semibold fst-italic mb-3"></h2>

            <div class="fs-5">
                <p id="tw-p1"></p>
                <p id="tw-p2" class="mb-1"></p>
                <p id="tw-p3" class="mb-0"></p>
            </div>
        </section>

    </main>

    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Steuerungsskript für die Tipp-Reihenfolge -->
    <script type="module">
        import { createTypewriter } from './js/Typewriter.js';

        // Alle Texte in der gewünschten Reihenfolge
        const steps = [
            { id: 'tw-title', text: 'Hi, ich bin Stephan!' },
            { id: 'tw-subtitle', text: 'Auszubildender Softwareentwickler' },
            { id: 'tw-welcome', text: 'Willkommen auf meiner persönlichen Webseite!' },
            { id: 'tw-p1', text: 'Ich freue mich, dass du hier bist!' },
            { id: 'tw-p2', text: 'Schau dich gerne um und zögere nicht, mich zu kontaktieren,' },
            { id: 'tw-p3', text: 'wenn du Fragen hast oder einfach nur Hallo sagen möchtest.' }
        ];

        // Erstellt ein Cursor-Element
        const cursor = document.createElement('span');
        cursor.className = 'typewriter-cursor';

        function runSequence(index = 0) {
            // Wenn alle Texte getippt wurden, Cursor entfernen und beenden
            if (index >= steps.length) {
                cursor.remove();
                return;
            }

            const current = steps[index];
            const targetElement = document.getElementById(current.id);

            if (!targetElement) return;

            // Cursor an das aktuelle Element anhängen
            targetElement.appendChild(cursor);

            const tw = createTypewriter(targetElement, current.text, {
                speed: 35, // Geschwindigkeit in ms (kleiner = schneller)
                loop: false,
                onComplete: () => {
                    // Nach Abschluss des aktuellen Textes zum nächsten springen
                    runSequence(index + 1);
                }
            });

            tw.start();
        }

        // Starte die Animation
        runSequence();

        // Lichtkegel folgt der Maus auf den Glas-Karten
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
                card.style.setProperty('--my', `${e.clientY - rect.top}px`);
            });
        });
    </script>

</body>
</html>
